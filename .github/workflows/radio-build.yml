name: Build Tamil Radio firmware (ESP32-S3-Touch-LCD-1.85C)

# Builds only the Waveshare 1.85C board with the radio player enabled.
on:
  workflow_dispatch:
  push:
    branches:
      - radio

permissions:
  contents: read

jobs:
  build:
    name: Build 1.85C (English, wake word: Hi Thipps)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py waveshare/esp32-s3-touch-lcd-1.85c \
            --name esp32-s3-touch-lcd-1.85c \
            --language en-US \
            --wake-word "custom:hi thipps"

      - name: Check radio player and custom wake word are enabled
        shell: bash
        run: |
          grep -q "CONFIG_USE_RADIO_PLAYER=y" sdkconfig
          grep -q "CONFIG_USE_CUSTOM_WAKE_WORD=y" sdkconfig
          grep -q 'CONFIG_CUSTOM_WAKE_WORD="hi thipps"' sdkconfig
          grep -q "CONFIG_SR_MN_EN_MULTINET7_QUANT=y" sdkconfig

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-tamil-radio-1.85c-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
